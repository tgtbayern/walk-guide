<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>随身导游</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --sky:#41B6E6; --star:#E4002B; --ink:#14212B; --paper:#FFFFFF; --mist:#EAF6FC; --line:#C9E6F4; --muted:#5B6B77;
  --latin:"Archivo Narrow","Arial Narrow",system-ui,sans-serif;
  --cjk:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --ink:#E8F1F6; --paper:#0E1A22; --mist:#132733; --line:#1F3B4C; --muted:#93A8B5; --sky:#5EC4EE; }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--cjk);font-size:17px;line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:0 20px 56px}
.flag{position:relative;padding:28px 0 22px}
.flag::before,.flag::after{content:"";position:absolute;left:-20px;right:-20px;height:10px;background:var(--sky)}
.flag::before{top:12px}.flag::after{bottom:0}
.title{display:flex;align-items:center;gap:12px;margin:14px 0 0}
.title h1{font-family:var(--latin);font-weight:700;font-size:34px;margin:0;line-height:1.1}
.title h1 span{font-family:var(--cjk)}
svg.star{width:30px;height:30px;flex:none;fill:var(--star)}
.sub{color:var(--muted);font-size:15px;margin:4px 0 0}

.loc{margin:22px 0 0;padding:14px 16px;border-left:6px solid var(--star);background:var(--mist);border-radius:0 10px 10px 0}
.loc .coords{font-family:var(--latin);font-size:15px;color:var(--muted)}
.loc .state{font-weight:600}

.main-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin:18px 0 0;padding:18px;border:0;border-radius:14px;background:var(--star);color:#fff;font:700 20px var(--cjk);cursor:pointer}
.main-btn:disabled{opacity:.55}
.main-btn svg{width:22px;height:22px;fill:#fff}
.row{display:flex;gap:10px;margin-top:12px}
.ghost{flex:1;padding:12px;border:2px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font:600 15px var(--cjk);cursor:pointer}
.ghost[aria-pressed="true"]{border-color:var(--sky);background:var(--mist)}
.ghost:disabled{opacity:.5}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

.status{display:none;margin-top:14px;padding:12px 16px;border-radius:12px;background:var(--mist);border:2px dashed var(--sky);font-size:15px}
.status.show{display:block}

details{margin-top:18px;border-top:2px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:600;color:var(--muted)}
label.lbl{display:block;margin-top:12px;font-size:14px;color:var(--muted)}
.field{width:100%;margin-top:6px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font:16px var(--cjk)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0}
.chip span{display:inline-block;padding:6px 14px;border-radius:999px;border:2px solid var(--line);font-size:15px;cursor:pointer}
.chip input:checked+span{background:var(--sky);border-color:var(--sky);color:#fff}
.map-wrap{position:relative;margin-top:16px}
#map{height:56vh;min-height:320px;max-height:560px;border-radius:14px;border:2px solid var(--line);z-index:0;background:var(--mist)}
.map-btn{position:absolute;right:10px;bottom:56px;z-index:500;width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:#1a73e8;font-size:22px;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer}
.map-hint{margin:6px 2px 0;font-size:13px;color:var(--muted)}
.pin-icon{background:none;border:0}
.pin{display:flex;flex-direction:column;align-items:center;width:96px;cursor:pointer}
.pin img,.pin b{display:block;width:48px;height:48px;border-radius:50%;border:3px solid #fff;object-fit:cover;box-shadow:0 1px 5px rgba(0,0,0,.45);background:var(--sky)}
.pin b{display:grid;place-items:center;color:#fff;font-size:20px}
.pin span{margin-top:2px;max-width:96px;padding:1px 6px;border-radius:8px;background:rgba(255,255,255,.92);color:#14212B;font:600 11px/1.4 var(--latin);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.pin.on img,.pin.on b{border-color:var(--star);transform:scale(1.15)}
.pin.on span{background:var(--star);color:#fff}
.picker{margin-top:22px;padding-top:14px;border-top:2px dashed var(--line)}
.picker-title{margin:0 0 8px;font-size:15px;color:var(--muted)}
.pick{margin:0 8px 8px 0;padding:8px 14px;border:2px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);font:15px var(--cjk);cursor:pointer;text-align:left}
.pick:hover{border-color:var(--sky)}
.secret{-webkit-text-security:disc;font-family:var(--latin)}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}

.ask{display:flex;gap:8px;margin-top:22px}
.ask .field{margin:0}
.ask button{flex:none;width:auto;padding:0 18px}

.story{margin-top:26px}
.story .where{font-size:19px;font-weight:700;margin:0 0 6px}
.story h2{display:flex;gap:10px;align-items:baseline;font-size:19px;margin:24px 0 6px;line-height:1.4}
.story h2::before{content:"";flex:none;width:12px;height:12px;background:var(--star);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.story ul{margin:0 0 8px;padding-left:1.2em}
.story li{margin:0 0 8px}
.story p{margin:0 0 10px}
.story .next{margin-top:20px;padding:14px 16px;border-radius:12px;background:var(--mist)}
.story .q{color:var(--muted);font-size:15px;margin:0 0 10px}
.thinking{color:var(--muted)}
.err{color:var(--star);font-weight:600}
.foot{margin-top:30px;font-size:13px;color:var(--muted)}
.hide{display:none!important}
@media (prefers-reduced-motion:no-preference){
  .pulse svg.star{animation:p 1.4s ease-in-out infinite}
  @keyframes p{50%{transform:scale(1.18)}}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="flag">
    <div class="title" id="titleRow">
      <svg class="star" viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,2 61,32 94,24 72,50 94,76 61,68 50,98 39,68 6,76 28,50 6,24 39,32"/></svg>
      <h1>Walk <span>随身导游</span></h1>
    </div>
    <p class="sub">边走边听身边建筑和街区的故事。</p>
  </header>

  <section id="setup" class="hide">
    <div class="status show">填入 API key 开始使用。key 不会被保存，关掉或刷新页面后需要重新填写。</div>
    <label class="lbl" for="kA">Anthropic API key（讲稿）</label>
    <input class="field secret" id="kA" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-1p-ignore data-lpignore="true" placeholder="sk-ant-…">
    <label class="lbl" for="kO">OpenAI API key（语音，可不填，不填就用系统朗读）</label>
    <input class="field secret" id="kO" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-1p-ignore data-lpignore="true" placeholder="sk-proj-…">
    <p class="err" id="keyErr" role="alert"></p>
    <button class="main-btn" id="saveKeys">开始</button>
  </section>

  <section id="app" class="hide">
    <section class="loc" aria-live="polite">
      <div class="state" id="locState">还没有定位</div>
      <div class="coords" id="coords">点下面的按钮开始</div>
    </section>

    <div class="map-wrap" id="mapWrap">
      <div id="map" role="application" aria-label="附近景点地图"></div>
      <button class="map-btn" id="recenter" type="button" aria-label="回到我的位置">◎</button>
      <p class="map-hint">蓝点是你，带照片的是附近景点。点哪个就讲哪个。</p>
    </div>

    <button class="main-btn" id="go">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
      讲讲我附近
    </button>
    <div class="row">
      <button class="ghost" id="autoBtn" aria-pressed="false">自动讲解：关</button>
      <button class="ghost" id="voiceBtn" aria-pressed="true">朗读：开</button>
    </div>
    <div class="row hide" id="stopRow"><button class="ghost" id="stopBtn">停止</button></div>
    <div class="status" id="status" role="status"></div>

    <div class="ask">
      <input class="field" id="question" type="text" placeholder="问导游：这栋楼谁设计的？" enterkeyhint="send">
      <button class="ghost" id="askBtn">问</button>
    </div>

    <article class="story" id="story" aria-live="polite"></article>

    <details>
      <summary>补充说明、兴趣和设置</summary>
      <label class="lbl" for="note">补充说明（写一句你看到的东西，定位会准很多）</label>
      <input class="field" id="note" type="text" placeholder="例如：我面前是一栋黑色玻璃高楼，右边是红色的桥">
      <div class="chips" id="chips">
        <label class="chip"><input type="checkbox" value="建筑和设计师" checked><span>建筑</span></label>
        <label class="chip"><input type="checkbox" value="历史" checked><span>历史</span></label>
        <label class="chip"><input type="checkbox" value="美食"><span>美食</span></label>
        <label class="chip"><input type="checkbox" value="影视取景"><span>影视取景</span></label>
        <label class="chip"><input type="checkbox" value="拍照机位"><span>拍照机位</span></label>
      </div>
      <label class="lbl" for="voice">语音音色（OpenAI）</label>
      <select class="field" id="voice">
        <option value="nova">nova</option><option value="coral">coral</option><option value="alloy">alloy</option>
        <option value="shimmer">shimmer</option><option value="echo">echo</option><option value="onyx">onyx</option>
      </select>
      <div class="row"><button class="ghost" id="resetKeys">更换 API key</button></div>
      <p class="hint">自动讲解：每走出约 300 米且距上次至少 4 分钟会自动讲下一段，连续 12 段后暂停。页面要保持在前台，锁屏后定位会停。</p>
    </details>

    <p class="foot">讲解由 AI 根据位置推断，具体数字和年份请以权威资料为准。</p>
  </section>
</div>

<script>
const MODEL = "claude-sonnet-5-5";
const showFatal = msg => { const el = document.getElementById("story"); if (el) el.insertAdjacentHTML("beforeend", `<p class="err">出错了：${String(msg).replace(/[&<>]/g, "")}</p>`); };
window.addEventListener("error", e => showFatal(e.message));
window.addEventListener("unhandledrejection", e => showFatal(e.reason?.message || e.reason?.msg || e.reason));
const $ = id => document.getElementById(id);
const AUTO_DIST = 300, AUTO_GAP = 4 * 60 * 1000, AUTO_MAX = 12;
const keys = { wg_kA: "", wg_kO: "" };   // API key 只放在内存里，关掉或刷新页面就没了
const store = {
  get: k => k in keys ? keys[k] : (() => { try { return localStorage.getItem(k) || ""; } catch (_) { return ""; } })(),
  set: (k, v) => { if (k in keys) { keys[k] = v; return; } try { localStorage.setItem(k, v); } catch (_) {} },
  del: k => { if (k in keys) { keys[k] = ""; return; } try { localStorage.removeItem(k); } catch (_) {} },
};

let pos = null, watchId = null, ctl = null, busy = false;
let lastTold = null, lastToldAt = 0, autoOn = false, autoCount = 0, wakeLock = null;
let voiceOn = true;
const covered = [];
const player = new Audio(); player.preload = "auto"; player.setAttribute("playsinline", "");

/* ---------- 初始化 ---------- */
function showApp(){ $("setup").classList.add("hide"); $("app").classList.remove("hide"); }
function showSetup(){ $("app").classList.add("hide"); $("setup").classList.remove("hide"); }
for (const id of ["voice"]) {
  const v = store.get("wg_" + id); if (v) $(id).value = v;
  $(id).onchange = () => store.set("wg_" + id, $(id).value);
}
try { localStorage.removeItem("wg_kA"); localStorage.removeItem("wg_kO"); } catch (_) {}
showSetup();
$("saveKeys").onclick = () => {
  const clean = v => v.replace(/[\s\u200B-\u200D\uFEFF]/g, "");   // 去掉粘贴带进来的空格、换行、零宽字符
  const a = clean($("kA").value), o = clean($("kO").value);
  if (!a.startsWith("sk-ant-")) { $("keyErr").textContent = "Anthropic key 应该以 sk-ant- 开头，请检查是否粘贴错了框。"; $("kA").focus(); return; }
  if (o && !o.startsWith("sk-")) { $("keyErr").textContent = "OpenAI key 应该以 sk- 开头。"; $("kO").focus(); return; }
  $("keyErr").textContent = "";
  store.set("wg_kA", a); if (o) store.set("wg_kO", o); else store.del("wg_kO");
  $("kA").value = ""; $("kO").value = "";
  showApp();
  bootMap();
};
async function bootMap(){
  if (pos) return;
  $("locState").textContent = "正在定位…";
  try {
    pos = await locateBest();
    $("locState").textContent = "已定位"; $("coords").textContent = fmt(pos);
    updateMe(); startWatch();
    $("story").innerHTML = '<p class="thinking">正在找你附近的景点…</p>';
    await gatherNearby();
    $("story").innerHTML = places.length
      ? `<p>附近找到 ${places.length} 个景点，已经标在地图上了。点照片就开讲，或者点「讲讲我附近」让我挑最近的讲。</p>`
      : "<p>这附近没查到带资料的景点。可以点「讲讲我附近」试试。</p>";
  } catch (e) {
    $("locState").textContent = "没有定位"; $("coords").textContent = geoErr(e);
    $("mapWrap").classList.add("hide");
    $("story").innerHTML = `<p class="err">${esc(geoErr(e))}</p>`;
  }
}
$("recenter").onclick = () => { if (map && pos) { followed = true; map.setView([pos.coords.latitude, pos.coords.longitude], 17); } };
$("resetKeys").onclick = () => { store.del("wg_kA"); store.del("wg_kO"); stopAuto(); showSetup(); };

/* ---------- 定位 ---------- */
function fmt(p){ const c = p.coords; return `${c.latitude.toFixed(5)}, ${c.longitude.toFixed(5)}　误差约 ${Math.round(c.accuracy)} 米`; }
function dist(a, b){
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(b.latitude - a.latitude), dLon = r(b.longitude - a.longitude);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.latitude))*Math.cos(r(b.latitude))*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function locate(){
  return new Promise((res, rej) => {
    if (!("geolocation" in navigator) || !window.isSecureContext) return rej({ code: 0 });
    const t = setTimeout(() => rej({ code: 3 }), 20000);   // 弹窗没点、系统没授权时浏览器可能一直不回调
    navigator.geolocation.getCurrentPosition(p => { clearTimeout(t); res(p); }, e => { clearTimeout(t); rej(e); },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 });
  });
}
// 先拿一次位置；误差大于 35 米时继续监听最多 6 秒，取误差最小的那次
async function locateBest(){
  let best = await locate();
  if (best.coords.accuracy <= 35) return best;
  $("story").innerHTML = `<p class="thinking">GPS 误差约 ${Math.round(best.coords.accuracy)} 米，再等几秒让定位更准…</p>`;
  await new Promise(res => {
    const id = navigator.geolocation.watchPosition(p => {
      if (p.coords.accuracy < best.coords.accuracy) best = p;
      if (best.coords.accuracy <= 25) { navigator.geolocation.clearWatch(id); res(); }
    }, () => {}, { enableHighAccuracy: true, maximumAge: 0 });
    setTimeout(() => { navigator.geolocation.clearWatch(id); res(); }, 6000);
  });
  return best;
}
function geoErr(e){
  if (e && e.code === 1) return "定位被拒绝了。手机：设置 → 隐私与安全性 → 定位服务 → Safari 网站，改成「使用期间」；电脑 Chrome：点地址栏左边的图标允许位置，Mac 还要在 系统设置 → 隐私与安全性 → 定位服务 里允许 Chrome。改完刷新页面。";
  if (e && e.code === 2) return "设备拿不到位置（可能是系统定位服务关了）。";
  if (e && e.code === 3) return "定位超时了，换个开阔点的地方再试。";
  if (!window.isSecureContext) return "这个页面要用 https 地址打开才能定位。";
  return "拿不到定位。可以在「补充说明」里写你在哪。";
}
function status(msg){ $("status").textContent = msg; $("status").classList.toggle("show", !!msg); }

/* ---------- 附近真实地点（维基百科 + OpenStreetMap） ---------- */
let nearby = [];   // 给讲解用：最近的 14 个 [{name, kind, dist, dir, info}]
let places = [];   // 给地图用：附近带照片的景点
let placesFrom = null;
function bearing(a, b){
  const r = x => x * Math.PI / 180, d = x => x * 180 / Math.PI;
  const y = Math.sin(r(b.lon - a.lon)) * Math.cos(r(b.lat));
  const x = Math.cos(r(a.lat)) * Math.sin(r(b.lat)) - Math.sin(r(a.lat)) * Math.cos(r(b.lat)) * Math.cos(r(b.lon - a.lon));
  return (d(Math.atan2(y, x)) + 360) % 360;
}
const COMPASS = ["北", "东北", "东", "东南", "南", "西南", "西", "西北"];
function dirText(brg, heading){
  let t = "在你" + COMPASS[Math.round(brg / 45) % 8] + "边";
  if (heading != null && !isNaN(heading)) {
    const rel = (brg - heading + 360) % 360;
    t += "，" + (rel < 30 || rel > 330 ? "正前方" : rel < 150 ? "右手边" : rel <= 210 ? "身后" : "左手边");
  }
  return t;
}
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
async function fetchWiki(lat, lon){
  const u = "https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=geosearch" +
    `&ggscoord=${lat}%7C${lon}&ggsradius=800&ggslimit=40&colimit=max&prop=coordinates%7Cdescription%7Cextracts%7Cpageimages` +
    "&exintro=1&explaintext=1&exsentences=4&exlimit=20&piprop=thumbnail&pithumbsize=160&pilimit=40";
  const j = await (await fetch(u)).json();
  const junk = /area code|radio station|television station|tv station|crash|disaster|accident|fire of|massacre|riot|^street in|zip code|postal code/i;
  return Object.values(j.query?.pages || {}).filter(p => p.coordinates && !junk.test(p.description || "") && !/^Area code/.test(p.title)).map(p => ({
    name: p.title, lat: p.coordinates[0].lat, lon: p.coordinates[0].lon, src: "维基百科",
    kind: p.description || "", info: (p.extract || "").replace(/\s+/g, " ").slice(0, 600),
    thumb: p.thumbnail?.source || "", wiki: true,
  }));
}
async function fetchOSM(lat, lon){
  const q = `[out:json][timeout:8];(nwr(around:180,${lat},${lon})[name][building];nwr(around:180,${lat},${lon})[name][historic];nwr(around:180,${lat},${lon})[name][tourism];nwr(around:180,${lat},${lon})[name][amenity~"^(theatre|place_of_worship|library|townhall|arts_centre)$"];);out center tags 60;`;
  const j = await (await fetch("https://overpass-api.de/api/interpreter", { method: "POST", body: "data=" + encodeURIComponent(q) })).json();
  return (j.elements || []).map(e => {
    const t = e.tags || {}, la = e.lat ?? e.center?.lat, lo = e.lon ?? e.center?.lon;
    const extra = [t["building:architecture"], t.architect && "建筑师 " + t.architect, t.start_date && "建成 " + t.start_date,
      t.height && "高 " + t.height + " 米", t["building:levels"] && t["building:levels"] + " 层", t.heritage && "文物保护",
      t.historic, t.tourism, t["addr:housenumber"] && t["addr:street"] && t["addr:housenumber"] + " " + t["addr:street"]].filter(Boolean).join("，");
    return { name: t["name:en"] || t.name, lat: la, lon: lo, src: "OpenStreetMap", kind: t.building && t.building !== "yes" ? t.building : (t.tourism || t.historic || t.amenity || "建筑"), info: extra };
  }).filter(x => x.lat != null);
}
async function fetchAddress(lat, lon){
  const j = await (await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&accept-language=en&lat=${lat}&lon=${lon}`)).json();
  return j.display_name || "";
}
let address = "";
async function gatherNearby(){
  nearby = []; address = "";
  if (!pos) return;
  const { latitude: lat, longitude: lon, heading } = pos.coords;
  const [w, o, a] = await Promise.allSettled([withTimeout(fetchWiki(lat, lon), 7000), withTimeout(fetchOSM(lat, lon), 9000), withTimeout(fetchAddress(lat, lon), 5000)]);
  if (a.status === "fulfilled") address = a.value;
  const seen = new Map();
  for (const p of [...(w.value || []), ...(o.value || [])]) {
    if (!p.name) continue;
    const key = p.name.toLowerCase().replace(/^the /, "").replace(/[^a-z0-9]/g, "").slice(0, 18);
    const d = dist({ latitude: lat, longitude: lon }, { latitude: p.lat, longitude: p.lon });
    const item = { ...p, dist: Math.round(d), dir: dirText(bearing({ lat, lon }, p), pos.coords.speed > 0.5 ? heading : null) };
    const prev = seen.get(key);
    if (!prev) seen.set(key, item);
    else {
      prev.info = [prev.info, item.info].filter(Boolean).join("；").slice(0, 800);
      prev.src = prev.src === item.src ? prev.src : "维基百科 + OpenStreetMap";
      prev.thumb = prev.thumb || item.thumb; prev.wiki = prev.wiki || item.wiki;
    }
  }
  const all = [...seen.values()].sort((a, b) => a.dist - b.dist);
  nearby = all.slice(0, 14);
  places = all.filter(p => p.wiki || /tourism|historic|attraction|museum|monument|artwork|theatre|place_of_worship/.test(p.kind)).slice(0, 35);
  placesFrom = { latitude: lat, longitude: lon };
  renderPlaces();
}
function nearbyText(){
  if (!pos) return "";

    nearby.forEach((p, i) => L.push(`${i + 1}. ${p.name}｜${p.kind || "地点"}｜约 ${p.dist} 米，${p.dir}｜来源：${p.src}${p.info ? "｜" + p.info : ""}`));
  } else L.push("（这次没能查到附近地点的数据，只能根据坐标判断，没把握的地方要直说。）");

let map = null, meDot = null, meRing = null, placeLayer = null, selected = "", followed = false;
function initMap(lat, lon){

function renderPlaces(){

}

function tourPrompt(focus, picked){

/* ---------- 渲染 ---------- */
function esc(s){ return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
function render(text, question){
  let html = question ? `<p class="q">你问：${esc(question)}</p>` : "", inList = false;
  for (const raw of text.split("\n")) {
    const line = raw.trim().replace(/\*\*/g, "");
    if (!line) continue;
    const isLi = /^[-•*]\s+/.test(line);
    if (inList && !isLi) { html += "</ul>"; inList = false; }
    if (line.startsWith("📍")) html += `<p class="where">${esc(line)}</p>`;
    else if (line.startsWith("## ")) html += `<h2>${esc(line.slice(3))}</h2>`;
    else if (line.startsWith("➜")) html += `<p class="next">${esc(line)}</p>`;
    else if (isLi) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${esc(line.replace(/^[-•*]\s+/, ""))}</li>`; }
    else html += `<p>${esc(line)}</p>`;
  }
  if (inList) html += "</ul>";
  $("story").innerHTML = html;
}

/* ---------- 语音：按段合成，按顺序播放 ---------- */
let speechQueue = [], playing = false, speechGen = 0;
function speakable(t){
  return t.split("\n").map(l => l.trim()).filter(Boolean)
    .map(l => l.replace(/^##\s*/, "").replace(/^[-•*]\s+/, "").replace(/[📍➜#*]/g, "")
               .replace(/（[A-Za-z][^）]*）/g, "")       // 去掉括号里的英文原名，听起来更顺
               .replace(/（(你|在|约|正|左|右|前|后|身后|对面)[^）]*）/g, ""))
    .join("。").replace(/。+/g, "。");
}
function resetSpeech(){
  speechGen++; speechQueue = []; playing = false;
  try { player.pause(); } catch (_) {}
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}
function enqueueSpeech(chunk){
  if (!voiceOn) return;
  const text = speakable(chunk); if (!text.replace(/[。\s]/g, "")) return;
  const gen = speechGen;
  const item = { text, audio: fetchTTS(text).catch(e => { ttsNote(e); return null; }) };   // 立即开始合成，播放时按顺序取
  speechQueue.push(item);
  if (!playing) playNext(gen);
}
let ttsNoted = false;
function ttsNote(e){
  if (ttsNoted) return; ttsNoted = true;
  const why = e?.message === "tts 401" ? "OpenAI key 无效" : e?.message === "tts 429" ? "OpenAI 额度不足或请求太频繁" : "OpenAI 语音合成失败（" + (e?.message || "网络问题") + "）";
  $("story").insertAdjacentHTML("beforeend", `<p class="err">${why}，已改用手机自带朗读。自带朗读在静音模式下没有声音，请把手机侧边的静音开关拨开。</p>`);
}
async function fetchTTS(text){
  const key = store.get("wg_kO"); if (!key) return null;
  const res = await fetch("https://api.openai.com/v1/audio/speech", {
    method: "POST",
    headers: { "Authorization": `Bearer ${key}`, "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "gpt-4o-mini-tts", voice: $("voice").value, input: text, response_format: "mp3",
      instructions: "用中文普通话讲解，语气像热情、见多识广的城市导游，口语化，语速稍快，自然停顿。",
    }),
  });
  if (!res.ok) throw new Error("tts " + res.status);
  return URL.createObjectURL(await res.blob());
}
async function playNext(gen){
  if (gen !== speechGen) return;
  const item = speechQueue.shift();
  if (!item) { playing = false; return; }
  playing = true;
  const url = await item.audio;
  if (gen !== speechGen) return;
  if (url) {
    player.src = url;
    player.onended = () => { URL.revokeObjectURL(url); playNext(gen); };
    try { await player.play(); return; } catch (_) { /* 被系统拦截就退回系统朗读 */ }
  }
  systemSpeak(item.text, () => playNext(gen));
}
function systemSpeak(text, done){
  if (!("speechSynthesis" in window)) return done();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN"; u.rate = 1.05; u.onend = done; u.onerror = done;
  speechSynthesis.speak(u);
}
function silentWav(){ // 生成一小段静音，用来在用户点击时"解锁"自动播放
  const n = 800, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
  const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); v.setUint32(4, 36 + n, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
  w(36, "data"); v.setUint32(40, n, true); for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
  return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
}
function unlockAudio(){
  player.src = silentWav(); player.play().catch(() => {});
  if ("speechSynthesis" in window) { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); }
}

/* ---------- 调用 Claude（流式） ---------- */
async function streamClaude(prompt, onText, signal){
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST", signal,
    headers: {
      "x-api-key": store.get("wg_kA"),
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
      "content-type": "application/json",
    },
    body: JSON.stringify({ model: MODEL, max_tokens: 4000, thinking: { type: "between_tools" }, stream: true, messages: [{ role: "user", content: prompt }] }),
  });
  if (!res.ok) {
    let msg = ""; try { msg = (await res.json()).error?.message || ""; } catch (_) {}
    throw { status: res.status, msg };
  }
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", text = "", stop = "";
  for (;;) {
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const evt = buf.slice(0, i); buf = buf.slice(i + 2);
      const line = evt.split("\n").find(l => l.startsWith("data: ")); if (!line) continue;
      let d; try { d = JSON.parse(line.slice(6)); } catch (_) { continue; }
      if (d.type === "content_block_delta" && d.delta?.type === "text_delta") { text += d.delta.text; onText(text); }
      if (d.type === "message_delta" && d.delta?.stop_reason) stop = d.delta.stop_reason;
      if (d.type === "error") throw { status: 500, msg: d.error?.message || "" };
    }
  }
  if (!text.trim()) throw { status: 0, msg: `模型没有返回正文（结束原因：${stop || "未知"}）` };
  return text;
}
function errText(e){
  if (e?.name === "AbortError") return "";
  if (e?.status === 401) {
    const k = store.get("wg_kA");
    return `Anthropic 拒绝了这个 key（${e.msg || "401"}）。页面收到的 key 是 ${k.slice(0, 14)}…${k.slice(-4)}，共 ${k.length} 位，和你的 key 对一下。不一致的话，点「补充说明、兴趣和设置」→「更换 API key」重新粘贴。`;
  }
  if (e?.status === 404) return "模型不可用。";
  if (e?.status === 429) return "请求太频繁或额度不足，自动讲解已暂停，稍后再试。";
  if (e?.status === 529 || e?.status === 503) return "服务暂时繁忙，等一会儿再试。";
  if (e instanceof TypeError) return "网络连不上，检查一下信号再试。";
  return "讲解没能完成" + (e?.msg ? `：${e.msg}` : "，稍后再试。");
}

/* ---------- 一次讲解 / 问答 ---------- */
async function run({ auto = false, question = "", focus = "", picked = false } = {}){
  if (busy) return;
  busy = true; resetSpeech();
  $("go").disabled = true; $("askBtn").disabled = true;
  $("titleRow").classList.add("pulse");

  if (!auto && !focus) {
    $("locState").textContent = "正在定位…";
    $("story").innerHTML = '<p class="thinking">正在获取你的位置…如果浏览器弹出定位授权，请点允许。</p>';
    try { pos = await locateBest(); $("locState").textContent = "已定位"; $("coords").textContent = fmt(pos); updateMe(); }
    catch (e) {
      if (!pos) { $("locState").textContent = "没有定位"; $("coords").textContent = geoErr(e); }
      if (!pos && !$("note").value.trim() && !question) {
        $("story").innerHTML = `<p class="err">${esc(geoErr(e))}</p><p>也可以不用定位：在下面「补充说明」里写你在哪，再点「讲讲我附近」。</p>`;
        document.querySelector("details").open = true;
        return done();
      }
    }
  }
  if (auto) { autoCount++; if (navigator.vibrate) navigator.vibrate(120); }
  if (pos && !focus) {
    $("story").innerHTML = '<p class="thinking">正在查你附近有哪些建筑…</p>';
    await gatherNearby();
  }

  $("story").innerHTML = `${question ? `<p class="q">你问：${esc(question)}</p>` : ""}<p class="thinking">${auto ? "到新地方了，" : ""}正在想…</p>`;
  $("stopRow").classList.remove("hide");
  ctl = new AbortController();

  // 已送去合成的位置：每写完一整行要点就先送去合成；标题行和下一条要点一起读
  let spokenUpTo = 0;
  const flush = (text, final) => {
    const lines = text.slice(spokenUpTo).split("\n");
    const complete = final ? lines : lines.slice(0, -1);   // 最后一行可能还没写完
    let ready = "", pending = "", consumed = 0, committed = 0;
    for (const l of complete) {
      consumed += l.length + 1;
      if (/^\s*##\s/.test(l)) { pending += l + "\n"; continue; }
      if (!l.trim()) continue;
      ready += pending + l + "\n"; pending = ""; committed = consumed;
    }
    if (final && pending) ready += pending;
    spokenUpTo += committed;
    if (ready.trim()) enqueueSpeech(ready);
  };

  try {
    const prompt = question ? askPrompt(question) : tourPrompt(focus, picked);
    const text = await streamClaude(prompt, t => { render(t, question); flush(t, false); }, ctl.signal);
    render(text, question); flush(text, true);
    for (const m of text.matchAll(/^##\s*([^（(\n]+)/gm)) covered.push(m[1].trim());
    if (!question) { if (pos) lastTold = pos.coords; lastToldAt = Date.now(); if (!picked) showPicker(); }
  } catch (e) {
    const msg = errText(e);
    if (msg) $("story").insertAdjacentHTML("beforeend", `<p class="err">${esc(msg)}</p>`);
    if ([401, 404, 429].includes(e?.status)) stopAuto();
  }
  done();

  function done(){
    busy = false;
    $("go").disabled = false; $("askBtn").disabled = false;
    $("stopRow").classList.add("hide");
    $("titleRow").classList.remove("pulse");
    if (autoOn && autoCount >= AUTO_MAX) { stopAuto(); status(`已经连续自动讲了 ${AUTO_MAX} 段，先暂停。想继续就再打开自动讲解。`); }
  }
}

/* ---------- 讲错了？让用户点选眼前的地方 ---------- */
function showPicker(){
  const told = new Set(covered.map(c => c.toLowerCase()));
  const opts = nearby.filter(p => ![...told].some(t => t.includes(p.name.toLowerCase()) || p.name.toLowerCase().includes(t))).slice(0, 8);
  if (!opts.length) return;
  const box = document.createElement("div");
  box.className = "picker";
  box.innerHTML = '<p class="picker-title">讲错了？点你眼前的那个：</p>';
  for (const p of opts) {
    const b = document.createElement("button");
    b.className = "pick"; b.type = "button";
    b.textContent = `${p.name}（${p.dist} 米）`;
    b.onclick = () => { unlockAudio(); run({ focus: p.name }); };
    box.appendChild(b);
  }
  const other = document.createElement("button");
  other.className = "pick"; other.type = "button"; other.textContent = "都不是，我来描述";
  other.onclick = () => { document.querySelector("details").open = true; $("note").focus(); };
  box.appendChild(other);
  $("story").appendChild(box);
}

/* ---------- 自动讲解 ---------- */
let geoWatch = null;
function startWatch(){
  if (geoWatch !== null || !("geolocation" in navigator) || !window.isSecureContext) return;
  geoWatch = navigator.geolocation.watchPosition(onMove, e => {
    if (autoOn) { status(geoErr(e)); if (e.code === 1) stopAuto(); }
  }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
}
function onMove(p){
  if (pos && p.coords.accuracy > 60 && p.coords.accuracy > pos.coords.accuracy * 2) return;   // 忽略明显变差的读数
  pos = p;
  $("locState").textContent = autoOn ? "自动讲解中" : "已定位";
  $("coords").textContent = fmt(p);
  updateMe();
  if (!busy && (!placesFrom || dist(placesFrom, p.coords) > 250)) { placesFrom = p.coords; refreshPlaces(); }   // 走远了就刷新地图上的景点
  if (!autoOn || busy) return;
  if (!lastTold) { status(""); run({ auto: true }); return; }
  const d = dist(lastTold, p.coords), wait = AUTO_GAP - (Date.now() - lastToldAt);
  if (d >= AUTO_DIST && wait <= 0 && document.visibilityState === "visible") { status(""); run({ auto: true }); return; }
  if (d < AUTO_DIST) status(`再走约 ${Math.round(AUTO_DIST - d)} 米，自动讲下一段。`);
  else status(`已经走出 ${Math.round(d)} 米，约 ${Math.ceil(wait / 60000)} 分钟后自动讲下一段。`);
}
async function keepAwake(){ try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (_) { wakeLock = null; } }
document.addEventListener("visibilitychange", () => { if (autoOn && document.visibilityState === "visible") keepAwake(); });

function startAuto(){
  if (!("geolocation" in navigator) || !window.isSecureContext) { status(geoErr({})); return; }
  autoOn = true; autoCount = 0;
  unlockAudio(); keepAwake(); startWatch();
  $("autoBtn").setAttribute("aria-pressed", "true"); $("autoBtn").textContent = "自动讲解：开";
  status("正在获取位置，拿到后马上开讲。");
}
function stopAuto(){
  autoOn = false;
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  $("autoBtn").setAttribute("aria-pressed", "false"); $("autoBtn").textContent = "自动讲解：关";
  if ($("locState").textContent === "自动讲解中") $("locState").textContent = "已定位";
  status("");
}

/* ---------- 按钮 ---------- */
$("go").onclick = () => { unlockAudio(); run(); };
$("autoBtn").onclick = () => autoOn ? stopAuto() : startAuto();
$("stopBtn").onclick = () => { ctl?.abort(); resetSpeech(); };
$("voiceBtn").onclick = () => {
  voiceOn = !voiceOn;
  $("voiceBtn").setAttribute("aria-pressed", voiceOn);
  $("voiceBtn").textContent = voiceOn ? "朗读：开" : "朗读：关";
  if (voiceOn) unlockAudio(); else resetSpeech();
};
const ask = () => { const q = $("question").value.trim(); if (!q) return; $("question").value = ""; unlockAudio(); run({ question: q }); };
$("askBtn").onclick = ask;
$("question").addEventListener("keydown", e => { if (e.key === "Enter") ask(); });
</script>
